name: Build and deploy KaMoRaLe Expo web

on:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "index.html"
      - "manifest.webmanifest"
      - ".github/workflows/expo-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Preserve the existing landing page
        run: |
          mkdir -p dist/app
          cp index.html manifest.webmanifest dist/
      - name: Export Expo web app into /app
        run: npx expo export --platform web --output-dir dist/app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://mijoszflieskuifnyiuo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Fix asset paths for GitHub Pages project site
        run: |
          sed -i 's|"/_expo/|"/KaMoRaLe/app/_expo/|g' dist/app/index.html
          sed -i "s|'/ _expo/|'/KaMoRaLe/app/_expo/|g" dist/app/index.html
          grep -o 'src="[^"]*AppEntry[^"]*"' dist/app/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
